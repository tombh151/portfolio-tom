<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>תם אדל בן חמו — עיצוב תעשייתי</title>
<meta name="description" content="עיצוב תעשייתי | פיתוח מוצר | ניהול פרויקטים">
<meta name="theme-color" content="#F2F1EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body class="is-loading">

<div class="loader" id="loader" aria-hidden="true">
  <div class="loader__shapes"><i class="shape shape--circle" style="--c:var(--blue)"></i><i class="shape shape--square" style="--c:var(--red)"></i><i class="shape shape--triangle" style="--c:var(--yellow)"></i><i class="shape shape--bowl" style="--c:var(--green)"></i></div>
  <div class="loader__name"><span id="loaderA"></span><span id="loaderB"></span></div>
</div>

<div class="wipe" id="wipe" aria-hidden="true"><div class="wipe__title" id="wipeTitle"></div></div>
<div class="cursor" id="cursor" aria-hidden="true"><span class="cursor__shape"></span><span class="cursor__icon"></span></div>
<div class="progress" id="progress" aria-hidden="true"></div>

<header class="hdr" id="hdr">
  <a class="brand" href="#/" data-home>
    <span class="brand__mark" aria-hidden="true"><i></i><i></i><i></i></span>
    <span class="brand__name" id="logoName"></span>
    <span class="brand__tag" id="logoTag"></span>
  </a>
  <div class="hdr__end">
    <nav class="nav" id="nav" aria-label="ניווט"></nav>
    <a class="hbtn hbtn--ink" id="hdrContact" href="#contact" data-scroll="contact"></a>
    <a class="hbtn back" id="closeBtn" href="#projects" data-scroll="projects" hidden><span class="back__arrow" aria-hidden="true">←</span><svg class="back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span class="back__label" id="closeLabel"></span></a>
  </div>
</header>

<main id="app" tabindex="-1"></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" hidden>
  <div class="lb__stage" id="lbStage"><img class="lb__img" id="lbImg" alt=""></div>
  <div class="lb__loupe" id="lbLoupe" aria-hidden="true"></div>
  <button class="lb__btn lb__close" id="lbClose" type="button"><span aria-hidden="true">×</span></button>
  <button class="lb__btn lb__prev" id="lbPrev" type="button"><span aria-hidden="true">→</span></button>
  <button class="lb__btn lb__next" id="lbNext" type="button"><span aria-hidden="true">←</span></button>
</div>

<script src="data.js"></script>
<script src="site.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
